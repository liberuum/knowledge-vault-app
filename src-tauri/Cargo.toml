[package]
name = "knowledge-vault-app"
version = "0.1.0"
description = "Knowledge Vault — a local desktop app for the Powerhouse Knowledge Vault"
authors = ["Powerhouse"]
license = "AGPL-3.0-only"
repository = "https://github.com/liberuum/knowledge-vault-app"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "knowledge_vault_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
url = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tiny_http = "0.12"
tauri-plugin-dialog = "2"
tar = "0.4"
