# Checks on every push to main and on pull requests: formatting, lint, type check and the unit tests, plus a
# Windows compile of the shell. Releases are a separate workflow (release.yml), run by a version tag. Not run
# here, run them locally: the end-to-end tests (bun run e2e; the release's smoke test covers the packaged app)
# and converter:check (needs the sibling docling checkout).
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/knowledge-vault-app/node
          key: kv-node-linux-x64-${{ hashFiles('scripts/node-version.mjs') }}
      - name: The vault package comes from the registry, never a local checkout
        run: |
          if grep -q '"file:' bun.lock; then echo "bun.lock links a local package (file:) — pin the published version"; exit 1; fi
      - run: bun install --frozen-lockfile
      - run: bun run versions:check
      - run: bun run stack:check
      - name: Bundle inputs (Tauri's build script needs them)
        run: node scripts/ensure-bundle-inputs.mjs
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: bun run tsc
      - run: bun run test

  # The shell compiles and lints on Windows too — Windows-only breakage shows on every push, not at release.
  windows-shell:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Bundle inputs (Tauri's build script needs them)
        run: node scripts/ensure-bundle-inputs.mjs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: The PDF models download on Windows (Node, no Unix shell) — pdfium lands where the converter looks
        shell: pwsh
        env:
          DOCLING_RS_HOME: ${{ runner.temp }}\docling-models
          DOCLING_FETCH_ONLY: pdfium
        run: |
          node sidecar/converter/fetch-models.mjs
          $dll = Join-Path $env:DOCLING_RS_HOME '.pdfium\lib\pdfium.dll'
          if (-not (Test-Path $dll)) { throw "pdfium.dll was not placed at $dll" }
          "pdfium.dll: $([math]::Round((Get-Item $dll).Length / 1MB, 1)) MB"

  # macOS: the shell compiles with its SIGTERM handling, and the engine's and the shell's process-tree
  # cleanup is exercised on real processes with macOS's own ps and kill.
  macos-shutdown:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Bundle inputs (Tauri's build script needs them)
        run: node scripts/ensure-bundle-inputs.mjs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: The shell's process-tree cleanup on real processes
        run: cargo test proc_tree
        working-directory: src-tauri
      - name: The engine's child reaper on real processes
        run: bunx vitest run sidecar/src/child-reaper.test.ts
