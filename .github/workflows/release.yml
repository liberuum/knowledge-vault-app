# A release is made on purpose: push a version tag (git tag v0.1.0 && git push origin v0.1.0). Every target
# builds into a DRAFT release and is checked there; the release is made public only when every target succeeded.
# Run by hand from the Actions tab to test the builds: the installers land in the draft release, which stays a
# draft unless "publish" is ticked.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release when every build succeeds (otherwise it stays a draft)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: A published version is never rebuilt — bump the version to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then echo "$tag is already published — bump the app version (package.json, Cargo.toml, tauri.conf.json)"; exit 1; fi
            echo "$tag exists as a draft from an earlier run; it will be replaced"
          fi

  # Every check a push to main gets (ci.yml), on the tagged commit itself: a tag on a commit that fails
  # them — or that never went through CI — builds nothing.
  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    needs: [preflight, checks]
    permissions:
      contents: write
      id-token: write # build provenance for the Linux files (actions/attest-build-provenance)
      attestations: write
    env:
      # Linux signing is on once the repository has a release key (docs/release-signing.md); until then a
      # release builds unsigned, as before. Only whether the secret is set — the key is read where it is used.
      RELEASE_SIGNING: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `assets` names the files on the release page by operating system, so people pick the right one:
          # Knowledge-Vault_0.1.1_Linux_x86-64.AppImage / .deb, …_macOS_Apple-silicon.dmg, …_Windows_x64-setup.exe
          - runner: ubuntu-22.04 # the oldest glibc the AppImage supports
            target: x86_64-unknown-linux-gnu
            assets: Knowledge-Vault_[version]_Linux_x86-64[ext]
          - runner: macos-14
            target: aarch64-apple-darwin
            assets: Knowledge-Vault_[version]_macOS_Apple-silicon[ext]
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            assets: Knowledge-Vault_[version]_Windows_x64[setup][ext]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/knowledge-vault-app/node
          key: kv-node-${{ matrix.target }}-${{ hashFiles('scripts/node-version.mjs') }}
      - run: bun install --frozen-lockfile
      - run: bun run versions:check
      - run: bun run build:host
      - run: bun run build:sidecar
      - name: Stage the engine for this target
        run: node scripts/stage-sidecar.mjs --target ${{ matrix.target }}
      - name: Bundle Node for this target
        run: node scripts/fetch-node.mjs --target ${{ matrix.target }}
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            node scripts/release-notes.mjs
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: The release key, so the AppImage is signed (Linux, when the repository has one)
        if: runner.os == 'Linux' && env.RELEASE_SIGNING == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$fpr" ]; then echo "RELEASE_GPG_PRIVATE_KEY holds no secret key"; exit 1; fi
          echo "the AppImage is signed with $fpr"
          # linuxdeploy's AppImage plugin signs whenever LDAI_SIGN is set, whatever its value (even empty), and a
          # failed signature aborts the bundle: so it is set here, with a key, never in the job's env.
          { echo "LDAI_SIGN=1"; echo "LDAI_SIGN_KEY=$fpr"; } >> "$GITHUB_ENV"
      - name: Quiet Spotlight and XProtect, so the disk image detaches (macOS)
        if: runner.os == 'macOS'
        run: |
          # Both scan a freshly mounted disk image file by file, and the engine is ~175,000 files: they kept the
          # image busy past hdiutil's detach timeout ("timeout for DiskArbitration expired", 0.2.5's first run).
          # A build machine needs neither.
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          for i in $(seq 1 20); do pgrep XProtect >/dev/null || break; sleep 3; done
      - id: bundle
        # macOS: hdiutil fails now and then on GitHub's runners (Resource busy); one retry below
        continue-on-error: ${{ runner.os == 'macOS' }}
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release key's passphrase, read by linuxdeploy only when LDAI_SIGN is set (empty for a key without one)
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: Knowledge Vault ${{ needs.preflight.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true # public only after every target passed (publish job)
          prerelease: true # until the builds are signed
          assetNamePattern: ${{ matrix.assets }}
      - name: Clear what the first attempt left mounted (macOS)
        if: runner.os == 'macOS' && steps.bundle.outcome == 'failure'
        run: |
          # A detach that timed out leaves the scratch image attached, and the retry would meet it busy.
          for v in /Volumes/dmg.*; do [ -d "$v" ] && { hdiutil detach "$v" -force || true; }; done
          rm -f src-tauri/target/release/bundle/macos/rw.*.dmg
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
      - name: Retry the macOS bundle once (verbose, so a second failure says why)
        if: runner.os == 'macOS' && steps.bundle.outcome == 'failure'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: Knowledge Vault ${{ needs.preflight.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true # public only after every target passed (publish job)
          prerelease: true # until the builds are signed
          assetNamePattern: ${{ matrix.assets }}
          args: --verbose
      - name: The .deb installs nothing into /usr/bin but the app's own binaries
        if: runner.os == 'Linux'
        run: node scripts/check-deb.mjs src-tauri/target/release/bundle/deb/*.deb
      - name: Smoke the AppImage (engine ready, page served, page reached the shell)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-app.mjs
      - name: The AppImage is signed, by the release key (Linux, when signed)
        if: runner.os == 'Linux' && env.RELEASE_SIGNING == 'true'
        # Verifies the embedded signature against the file and requires the signer to be the imported key
        run: node scripts/verify-appimage.mjs "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)" "$LDAI_SIGN_KEY"
      - name: The Linux files under the names the release gives them, for their provenance
        if: runner.os == 'Linux'
        run: |
          v="${{ needs.preflight.outputs.tag }}"; v="${v#v}"; b=src-tauri/target/release/bundle
          {
            printf '%s  %s\n' "$(sha256sum $b/appimage/*.AppImage | cut -d' ' -f1)" "Knowledge-Vault_${v}_Linux_x86-64.AppImage"
            printf '%s  %s\n' "$(sha256sum $b/deb/*.deb | cut -d' ' -f1)" "Knowledge-Vault_${v}_Linux_x86-64.deb"
          } > linux-files.sha256
          cat linux-files.sha256
      - name: Build provenance for the Linux files (gh attestation verify <file> --repo liberuum/knowledge-vault-app)
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: linux-files.sha256
      - name: Smoke the macOS app
        if: runner.os == 'macOS'
        run: node scripts/smoke-app.mjs
      - name: Install the Windows build and launch it (engine unpacked, ready, page served, page reached the shell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB)) MB"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Knowledge Vault') -Filter *.exe -Recurse -Depth 1 | Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { throw 'the installer did not install the app' }
          "installed: $($exe.FullName)"
          $env:KV_SMOKE = '1'
          $env:KV_SMOKE_SECS = '300' # the first launch unpacks the engine
          $started = Get-Date
          $app = Start-Process -FilePath $exe.FullName -PassThru -Wait
          "exit $($app.ExitCode) after $([math]::Round(((Get-Date) - $started).TotalSeconds)) s"
          $log = Join-Path $env:APPDATA 'io.github.liberuum.knowledge-vault-app\vault\logs\sidecar.log'
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if ($app.ExitCode -ne 0) { throw 'the installed app did not pass its smoke check' }

  publish:
    needs: [preflight, build]
    # A tag publishes; a manual run only when asked to.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_SIGNING: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer sizes in the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-sizes.mjs "${{ needs.preflight.outputs.tag }}"
      - name: SHA256SUMS of every file, signed with the release key when the repository has one (SHA256SUMS.asc)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          mkdir release-files && cd release-files
          gh release download "$tag" --pattern 'Knowledge-Vault_*'
          sha256sum Knowledge-Vault_* > SHA256SUMS
          cat SHA256SUMS
          files=(SHA256SUMS)
          if [ "$RELEASE_SIGNING" = true ]; then
            printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
            fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
            printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$fpr" --armor --detach-sign SHA256SUMS
            gpg --batch --verify SHA256SUMS.asc SHA256SUMS
            files+=(SHA256SUMS.asc)
          fi
          gh release upload "$tag" "${files[@]}" --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.preflight.outputs.tag }}" --draft=false
